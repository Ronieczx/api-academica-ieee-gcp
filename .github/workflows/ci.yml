name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  prueba:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academica_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Verificar repositorio limpio
        run: |
          ! git ls-files | grep -q "__pycache__"
          python -m compileall -q api scripts tests

      - name: Instalar dependencias fijadas
        run: pip install -r requirements.txt

      - name: Ejecutar pruebas unitarias, integracion y equivalencia funcional
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/academica_db
        run: python -m pytest -v
